<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Terminal frame - 1980s aesthetic -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a9eff"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Rounded terminal body (stroke aids visibility on light backgrounds) -->
  <rect x="8" y="8" width="112" height="112" rx="16" ry="16" fill="url(#bg)" stroke="#374151" stroke-width="2" filter="url(#shadow)"/>
  <!-- Title bar strip -->
  <rect x="16" y="16" width="96" height="12" rx="4" ry="4" fill="#2d3748"/>
  <!-- Terminal content area -->
  <rect x="20" y="36" width="88" height="76" rx="6" ry="6" fill="#0f0f1a"/>
  <!-- Prompt cursor (matches TUI accent) -->
  <text x="26" y="70" font-family="monospace" font-size="26" font-weight="bold" fill="#4a9eff">&gt;</text>
  <!-- Stylized v for vibe (lowercase = approachable, on-brand) -->
  <text x="46" y="70" font-family="monospace" font-size="32" font-weight="bold" fill="#f1f5f9">v</text>
  <!-- Sub-line: PDA hint -->
  <text x="28" y="96" font-family="monospace" font-size="12" fill="#64748b">PDA</text>
</svg>
